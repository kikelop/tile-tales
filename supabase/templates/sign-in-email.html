<html>
  <body style="margin:0;padding:0;background-color:#f5f2ed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f2ed;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#ffffff;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="background-color:#3446bc;padding:28px 32px;text-align:center;">
                <span style="color:#ffffff;font-size:20px;font-weight:800;letter-spacing:0.08em;">TILE TALES</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px;font-size:20px;color:#1a1a1a;">Sign in to Tile Tales</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#555555;">
                  Tap the button below to sign in. Your tile collection will sync to this device automatically.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td align="center">
                      <a href="{{ .ConfirmationURL }}"
                         style="display:inline-block;background-color:#3446bc;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:14px 32px;border-radius:12px;">
                        Sign in
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#8a8578;">
                  If you didn't request this email, you can safely ignore it. The link expires in 1 hour and only works once.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

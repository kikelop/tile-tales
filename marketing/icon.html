<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #fff; }
  #icon {
    width: 1024px;
    height: 1024px;
    background: #2f4a78; /* deep azulejo blue */
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div id="icon">
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- An 8-point star = two overlapping squares, the classic azulejo motif -->
        <g id="star8">
          <rect x="-200" y="-200" width="400" height="400" />
          <rect x="-200" y="-200" width="400" height="400" transform="rotate(45)" />
        </g>
        <g id="star8small">
          <rect x="-150" y="-150" width="300" height="300" />
          <rect x="-150" y="-150" width="300" height="300" transform="rotate(45)" />
        </g>
      </defs>

      <!-- Cream tessellating stars -->
      <g fill="#ece4d6">
        <!-- corner quarter-stars imply a repeating tile wall -->
        <use href="#star8small" transform="translate(0,0)" />
        <use href="#star8small" transform="translate(1024,0)" />
        <use href="#star8small" transform="translate(0,1024)" />
        <use href="#star8small" transform="translate(1024,1024)" />
        <!-- hero center star -->
        <use href="#star8" transform="translate(512,512)" />
      </g>

      <!-- Center detail: blue octagon + cream pip -->
      <g transform="translate(512,512)">
        <rect x="-95" y="-95" width="190" height="190" fill="#2f4a78" />
        <rect x="-95" y="-95" width="190" height="190" fill="#2f4a78" transform="rotate(45)" />
        <circle r="34" fill="#ece4d6" />
      </g>
    </svg>
  </div>
</body>
</html>
